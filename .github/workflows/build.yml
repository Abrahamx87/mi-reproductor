name: Construir Opsound

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # Guarda la misma llave de firma entre armados para poder actualizar la app sin desinstalar.
      - name: Llave de firma
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: opsound-debug-keystore-v1

      - name: Armar APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Opsound.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Opsound
          path: Opsound.apk

      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Opsound v1.0.${{ github.run_number }}
          files: Opsound.apk
          body: ${{ github.event.head_commit.message }}
          make_latest: true
