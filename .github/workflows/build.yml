name: Construir Opsound

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # Llave de firma fija (guardada como secreto en GitHub) para poder actualizar sin desinstalar.
      - name: Preparar llave de firma
        env:
          FIRMA: ${{ secrets.OPSOUND_FIRMA }}
        run: |
          if [ -z "$FIRMA" ]; then
            echo "::error::Falta el secreto OPSOUND_FIRMA en Settings > Secrets and variables > Actions"
            exit 1
          fi
          PASS="${FIRMA%%:*}"
          echo "::add-mask::$PASS"
          printf '%s' "${FIRMA#*:}" | base64 -d > "$RUNNER_TEMP/opsound.p12"
          echo "OPSOUND_KEYSTORE=$RUNNER_TEMP/opsound.p12" >> "$GITHUB_ENV"
          echo "OPSOUND_KEY_PASS=$PASS" >> "$GITHUB_ENV"

      - name: Armar APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk Opsound.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Opsound
          path: Opsound.apk

      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Opsound v1.0.${{ github.run_number }}
          files: Opsound.apk
          body: ${{ github.event.head_commit.message }}
          make_latest: true
